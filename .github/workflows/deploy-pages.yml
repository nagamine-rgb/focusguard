name: Deploy FocusGuard Web Remote to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # アップロードと公開を別ジョブに分ける（GitHub 公式のひな形と同じ構成）。
  # 同じジョブで続けて実行すると、アップロード直後に公開側が
  # 「github-pages アーティファクトが0件」と判定して失敗することがある。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload web directory artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
