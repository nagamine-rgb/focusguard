name: Build & Release (Windows + Android)

on:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - "android/**"
      - "web/**"
      - ".github/workflows/build-release.yml"
  pull_request:
    paths:
      - "windows/**"
      - "android/**"
      - "web/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FocusGuard.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows/build.ps1

      - name: Package Windows ZIP (exe + web UI)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-win/web | Out-Null
          Copy-Item windows/FocusGuard.exe dist-win/FocusGuard.exe
          Copy-Item web/index.html dist-win/web/index.html
          Compress-Archive -Path dist-win/* -DestinationPath FocusGuard-Windows.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            windows/FocusGuard.exe
            FocusGuard-Windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 毎回同じ鍵で署名しないと、スマホで上書き更新できない（「既存のパッケージと競合」になる）。
      # 鍵は Secrets: ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export FG_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../FocusGuard.apk
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::署名の鍵が Secrets にないため、確認用にデバッグ版をビルドします（リリースには使いません）"
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../FocusGuard.apk
          else
            echo "::error::署名の鍵が Secrets にありません。README の「Android の署名」を見て ANDROID_KEYSTORE_BASE64 などを登録してください"
            exit 1
          fi

      - name: Check APK signature
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs FocusGuard.apk | grep -i "SHA-256"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: FocusGuard.apk

  publish-release:
    needs: [build-windows, build-android]
    # PR ではビルドの確認だけ行い、リリースは公開しない
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files

      - name: Flatten release files
        run: |
          mkdir -p dist
          find release-files -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Publish Combined Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FocusGuard Latest (Windows & Android)
          body: |
            FocusGuard の最新ビルド（Windows PC 版 ＆ Android スマホ版）です。

            ### ダウンロード
            - **Windows PC 版**: `FocusGuard.exe`（単体実行）または `FocusGuard-Windows.zip`（ローカル Web UI 同梱）
            - **Android スマホ版**: `FocusGuard.apk`（スマホでタップしてインストール）

            ### Web リモコン
            - https://nagamine-rgb.github.io/focusguard/
          files: |
            dist/FocusGuard.exe
            dist/FocusGuard-Windows.zip
            dist/FocusGuard.apk
          make_latest: true
