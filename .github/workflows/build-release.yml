name: Build & Release (Windows + Android)

on:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - "android/**"
      - "web/**"
      - ".github/workflows/build-release.yml"
  pull_request:
    paths:
      - "windows/**"
      - "android/**"
      - "web/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FocusGuard.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows/build.ps1

      - name: Package Windows ZIP (exe + web UI)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-win/web | Out-Null
          Copy-Item windows/FocusGuard.exe dist-win/FocusGuard.exe
          Copy-Item web/index.html dist-win/web/index.html
          Compress-Archive -Path dist-win/* -DestinationPath FocusGuard-Windows.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            windows/FocusGuard.exe
            FocusGuard-Windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FocusGuard.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: FocusGuard.apk

  publish-release:
    needs: [build-windows, build-android]
    # PR ではビルドの確認だけ行い、リリースは公開しない
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files

      - name: Flatten release files
        run: |
          mkdir -p dist
          find release-files -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Publish Combined Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FocusGuard Latest (Windows & Android)
          body: |
            FocusGuard の最新ビルド（Windows PC 版 ＆ Android スマホ版）です。

            ### ダウンロード
            - **Windows PC 版**: `FocusGuard.exe`（単体実行）または `FocusGuard-Windows.zip`（ローカル Web UI 同梱）
            - **Android スマホ版**: `FocusGuard.apk`（スマホでタップしてインストール）

            ### Web リモコン
            - https://nagamine-rgb.github.io/focusguard/
          files: |
            dist/FocusGuard.exe
            dist/FocusGuard-Windows.zip
            dist/FocusGuard.apk
          make_latest: true
